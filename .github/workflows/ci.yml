name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      # Run the whole graph, not `...[origin/main]`: on a push to main that base IS
      # HEAD → diff is empty → 0 tasks → the gate silently passed without running
      # typecheck/test/build. turbo's cache keeps a full run cheap. --continue
      # aggregates all failures instead of stopping at the first.
      - run: pnpm turbo run typecheck test build --continue

  # Build + push changed app images, then bump the tag in gitops.
  # AUDIT_MINIMAX #54: CI → gitops bump is implemented (was TODO).
  # On PR (AUDIT_MINIMAX #62) we also do a docker build without push to catch
  # broken Dockerfiles before merge.
  images:
    needs: quality
    runs-on: ubuntu-latest
    # pull-requests: read is required by dorny/paths-filter on pull_request events
    # (it lists changed files via the GitHub API). Without it the API call 403s
    # ("Resource not accessible by integration") and the whole job fails.
    permissions: { contents: read, packages: write, id-token: write, pull-requests: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backends → Dockerfile.nest, frontends (standalone Next) → Dockerfile.next.
          - { app: landing-web, dockerfile: infra/Dockerfile.next }
          - { app: auth-backend, dockerfile: infra/Dockerfile.nest }
          - { app: notifications-backend, dockerfile: infra/Dockerfile.nest }
          - { app: payments-backend, dockerfile: infra/Dockerfile.nest }
          - { app: id-web, dockerfile: infra/Dockerfile.next }
          - { app: pay-web, dockerfile: infra/Dockerfile.next }
          - { app: edu-backend, dockerfile: infra/Dockerfile.nest }
          - { app: edu-web, dockerfile: infra/Dockerfile.next }
          - { app: budget-backend, dockerfile: infra/Dockerfile.nest }
          - { app: budget-web, dockerfile: infra/Dockerfile.next }
          - { app: itmaxxing-backend, dockerfile: infra/Dockerfile.nest }
          - { app: itmaxxing-web, dockerfile: infra/Dockerfile.next }
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            app:
              - 'apps/${{ matrix.app }}/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'infra/**'
              - 'charts/**'
              - 'tsconfig.base.json'

      - name: Set up Docker Buildx
        if: steps.changed.outputs.app == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && steps.changed.outputs.app == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # AUDIT_MINIMAX #50, #53: cache-from + cache-to to GHA.
      - name: Build PR (no push)
        if: github.ref != 'refs/heads/main' && steps.changed.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP=${{ matrix.app }}
          push: false
          tags: ghcr.io/outegro/monorepo/${{ matrix.app }}:pr-${{ github.event.pull_request.number }}
          # Линкует пакет к репо outegro/monorepo → наследование доступов/видимости (монорепо: имя пакета ≠ имя репо).
          labels: |
            org.opencontainers.image.source=https://github.com/outegro/monorepo
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Build & push (main)
        if: github.ref == 'refs/heads/main' && steps.changed.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ghcr.io/outegro/monorepo/${{ matrix.app }}:${{ github.sha }}
          # Линкует пакет к репо outegro/monorepo → наследование доступов/видимости (монорепо: имя пакета ≠ имя репо).
          labels: |
            org.opencontainers.image.source=https://github.com/outegro/monorepo
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # NOTE: the gitops tag-bump used to live here as a `bump-gitops` job gated on
  # `github.ref == 'refs/heads/main'`. Even when skipped it still showed up as a
  # check on every PR. It now lives in a dedicated `deploy.yml` triggered via
  # `workflow_run` after CI succeeds on main, so it never appears on PRs.
